plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        'better-anvils' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    clientCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    clientCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    if (!providers.gradleProperty('withoutOptionalGui').isPresent()) {
        clientRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
        clientRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'better-anvils-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

test {
    useJUnitPlatform()
}

tasks.register('verifyModMetadata') {
    inputs.file('src/main/resources/fabric.mod.json')
    inputs.property('minecraftVersion', minecraft_version)
    inputs.property('javaVersion', 25)
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(file('src/main/resources/fabric.mod.json'))
        assert metadata.id == 'better-anvils': "Unexpected mod id: ${metadata.id}"
        assert metadata.depends.minecraft == minecraft_version: "Unexpected Minecraft requirement: ${metadata.depends.minecraft}"
        assert metadata.depends.java == '>=25': "Unexpected Java requirement: ${metadata.depends.java}"
        assert sourceSets.main.java.srcDirs.contains(file('src/main/java'))
        assert sourceSets.client.java.srcDirs.contains(file('src/client/java'))
    }
}

processResources {
    inputs.property('version', project.version)
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModMetadata')
}
